apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 83.0.1
    helm:
      valuesObject:
        grafana:
          resources:
            requests:
              cpu: 8m
              memory: 88Mi
        prometheusOperator:
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
